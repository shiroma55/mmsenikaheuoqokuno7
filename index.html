-<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026年度 成人式</title>
    <style>
   body {
    font-family: sans-serif;
    padding: 20px;
    line-height: 1.6;
    background-color: #222;   /* ダーク背景 */
    color: #f0f0f0;           /* 文字を明るく */
}
    background-color: #222;   /* ダーク背景 */
    color: #f0f0f0;           /* 文字を明るく */
} 
        h1 {
            text-align: center;
            margin-bottom: 20px;
        }
        .row {
            margin-bottom: 15px;
        }
        input, select, button {
            padding: 8px;
            margin-right: 8px;
            font-size: 16px;
        }
        .label {
            font-weight: bold;
            margin-right: 10px;
        }
        .status-box {
            margin-top: 20px;
            padding: 10px;
            border: 1px solid #aaa;
        }
    </style>
</head>
<body>

<h1>2026年度 成人式</h1>

<!-- 名前・番号検索 -->
<div class="row">
    <span class="label">名前入力</span>
    <input type="text" id="nameInput">
    <button>検索</button>
</div>

<div class="row">
    <button onclick="location.href='new_person.html'">新規成人者追加</button>
    <button onclick="location.href='new_staff.html'">新規担当者追加</button>
</div> 
<div class="row">
    <span class="label">番号入力</span>
    <input type="text" id="numberInput">
    <button>検索</button>
</div>

<!-- 入店情報 -->
<div class="row">
    <span class="label">入店時間:</span>
    <span id="entryTime">--:--</span>
</div>

<div class="row">
    <span class="label">番号:</span>
    <span id="displayNumber">---</span>
</div>

<div class="row">
    <span class="label">名前:</span>
    <span id="displayName">---</span>
</div>

<div class="row">
    <span class="label">備考:</span>
    <span id="displayNote">---</span>
</div>

<!-- 着付けブロック -->
<div class="section">

    <!-- 1行目：お直し -->
    <div class="row">
        <span class="label">お直し</span>
    </div>

    <!-- 2行目：あり・なし -->
    <div class="row" style="margin-left: 80px;">
        <span class="label">あり</span>
        <span class="label" style="margin-left: 40px;">なし</span>
    </div>

    <!-- 3行目：着付け＋担当者枠＋チェックボックス＋お直し担当者 -->
    <div class="row">

        <!-- 着付け -->
        <span class="label">着付け</span>

        <!-- 担当者① -->
        <select id="kimonoStaff1" style="margin-left: 10px;">
            <option value="">選択してください</option>
        </select>

        <!-- 担当者② -->
        <select id="kimonoStaff2" style="margin-left: 10px;">
            <option value="">選択してください</option>
        </select>

        <!-- チェックボックス（あり） -->
        <input type="checkbox" name="kimonoFixYes" style="margin-left: 20px;">

        <!-- チェックボックス（なし） -->
        <input type="checkbox" name="kimonoFixNo" style="margin-left: 40px;">

        <!-- お直し担当者枠 -->
        <select id="kimonoFixStaff" style="margin-left: 20px;">
            <option value="">選択してください</option>
        </select>

    </div>

</div>
</div>

<div class="row">
    <span class="label">メイク:</span>
    <select id="makeSelect">
        <option value="">選択してください</option>
    </select>
</div>

<div class="row">
    <span class="label">ヘアー:</span>
    <select id="hairSelect">
        <option value="">選択してください</option>
    </select>
</div>

<!-- 進行状況 -->
<div class="status-box">
    <div>着付け: 仕上がり <span id="kimonoDone">0</span> / 全体 <span id="kimonoTotal">0</span></div>
    <div>メイク: 仕上がり <span id="makeDone">0</span> / 全体 <span id="makeTotal">0</span></div>
    <div>ヘアー: 仕上がり <span id="hairDone">0</span> / 全体 <span id="hairTotal">0</span></div>
</div>

</body>
</html>
