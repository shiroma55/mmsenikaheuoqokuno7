-<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026年度 成人式</title>
    <style>
   body {
    font-family: sans-serif;
    padding: 20px;
    line-height: 1.6;
    background-color: #222;   /* ダーク背景 */
    color: #f0f0f0;           /* 文字を明るく */
}
    background-color: #222;   /* ダーク背景 */
    color: #f0f0f0;           /* 文字を明るく */
} 
        h1 {
            text-align: center;
            margin-bottom: 20px;
        }
        .row {
            margin-bottom: 15px;
        }
        input, select, button {
            padding: 8px;
            margin-right: 8px;
            font-size: 16px;
        }
        .label {
            font-weight: bold;
            margin-right: 10px;
        }
        .status-box {
            margin-top: 20px;
            padding: 10px;
            border: 1px solid #aaa;
        }
    </style>
</head>
<body>

<h1>2026年度 成人式</h1>

<!-- 名前・番号検索 -->
<div class="row">
    <span class="label">名前入力</span>
    <input type="text" id="nameInput">
    <button>検索</button>
</div>

<div class="row">
    <button onclick="location.href='new_person.html'">新規成人者追加</button>
    <button onclick="location.href='new_staff.html'">新規担当者追加</button>
</div> 
<div class="row">
    <span class="label">番号入力</span>
    <input type="text" id="numberInput">
    <button>検索</button>
</div>

<!-- 入店情報 -->
<div class="row">
    <span class="label">入店時間:</span>
    <span id="entryTime">--:--</span>
</div>

<div class="row">
    <span class="label">番号:</span>
    <span id="displayNumber">---</span>
</div>

<div class="row">
    <span class="label">名前:</span>
    <span id="displayName">---</span>
</div>

<div class="row">
    <span class="label">備考:</span>
    <span id="displayNote">---</span>
</div>

<!-- 着付けブロック -->
<table style="border-collapse: collapse; margin-top: 10px; width: 100%; table-layout: fixed;">

    <colgroup>
        <col style="width: 20%;">   <!-- 着付け / 空白 -->
        <col style="width: 15%;">   <!-- 担当者① -->
        <col style="width: 15%;">   <!-- 担当者② -->
        <col style="width: 10%;">   <!-- お直し / あり -->
        <col style="width: 10%;">   <!-- なし -->
        <col style="width: 30%;">   <!-- お直し担当者 -->
    </colgroup>

    <!-- 1行目：お直し（★ 4列目に置く） -->
    <tr>
    <td></td>
    <td></td>
    <td></td>
    <td style="text-align:center; white-space: nowrap;">お直し</td>
    <td></td>
    <td></td>
</tr>

    <!-- 2行目：あり・なし -->
    <tr>
        <td></td>
        <td></td>
        <td></td>
        <td style="text-align:center;">あり</td>
        <td style="text-align:center;">なし</td>
        <td></td>
    </tr>

    <!-- 3行目：着付け＋担当者枠＋チェックボックス＋お直し担当者 -->
    <tr>
        <td>着付け</td>

        <td>
            <select id="kimonoStaff1" style="width: 90%;">
                <option value="">選択してください</option>
            </select>
        </td>

        <td>
            <select id="kimonoStaff2" style="width: 90%;">
                <option value="">選択してください</option>
            </select>
        </td>

        <td style="text-align:center;">
            <input type="checkbox" name="kimonoFixYes">
        </td>

        <td style="text-align:center;">
            <input type="checkbox" name="kimonoFixNo">
        </td>

        <td>
            <select id="kimonoFixStaff" style="width: 90%;">
                <option value="">選択してください</option>
            </select>
        </td>
    </tr>

</table>
</div>

<table style="border-collapse: collapse; margin-top: 20px; width: 100%; table-layout: fixed;">

    <colgroup>
        <col style="width: 20%;">   <!-- メイク -->
        <col style="width: 15%;">   <!-- 担当者① -->
        <col style="width: 15%;">   <!-- 担当者② -->
        <col style="width: 10%;">   <!-- あり -->
        <col style="width: 10%;">   <!-- なし -->
        <col style="width: 30%;">   <!-- お直し担当者 -->
    </colgroup>

    <!-- ★ メイクは1行だけでOK -->
    <tr>
        <td>メイク</td>

        <td>
            <select id="makeStaff1" style="width: 90%;">
                <option value="">選択してください</option>
            </select>
        </td>

        <td>
            <select id="makeStaff2" style="width: 90%;">
                <option value="">選択してください</option>
            </select>
        </td>

        <td style="text-align:center;">
            <input type="checkbox" name="makeFixYes">
        </td>

        <td style="text-align:center;">
            <input type="checkbox" name="makeFixNo">
        </td>

        <td>
            <select id="makeFixStaff" style="width: 90%;">
                <option value="">選択してください</option>
            </select>
        </td>
    </tr>

</table>
<div class="row">
    <span class="label">ヘアー:</span>
    <select id="hairSelect">
        <option value="">選択してください</option>
    </select>
</div>

<!-- 進行状況 -->
<div class="status-box">
    <div>着付け: 仕上がり <span id="kimonoDone">0</span> / 全体 <span id="kimonoTotal">0</span></div>
    <div>メイク: 仕上がり <span id="makeDone">0</span> / 全体 <span id="makeTotal">0</span></div>
    <div>ヘアー: 仕上がり <span id="hairDone">0</span> / 全体 <span id="hairTotal">0</span></div>
</div>

</body>
</html>
