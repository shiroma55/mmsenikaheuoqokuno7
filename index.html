<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026年度成人式</title>

    <style>
        body {
            font-family: sans-serif;
            padding: 20px;
            line-height: 1.6;
            background-color: #222;
            color: #f0f0f0;
        }
        h1 {
            text-align: center;
            margin-bottom: 20px;
        }
        .row {
            margin-bottom: 15px;
        }
        input, select, button {
            padding: 8px;
            margin-right: 8px;
            font-size: 16px;
        }
        .label {
            font-weight: bold;
            margin-right: 10px;
        }
        .section {
            margin-top: 20px;
        }
        .status-box {
            margin-top: 20px;
            padding: 10px;
            border: 1px solid #aaa;
        }
    </style>
</head>

<body>

<h1>2026年度成人式</h1>

<!-- ▼ Excel ファイル選択 -->
<div id="fileSelectArea" class="section">
    <div class="row">
        <span class="label">お客様データファイル：</span>
        <input type="file" id="customerFile" accept=".xlsx">
    </div>

    <div class="row">
        <span class="label">スタッフデータファイル：</span>
        <input type="file" id="staffFile" accept=".xlsx">
    </div>
</div>

<!-- ▼ 名前検索の候補プルダウン（ここが本物） -->
<div id="customerSearchArea" class="section" style="display:none;">
    <div class="row">
        <span class="label">候補：</span>
        <select id="customerSelect" style="width:250px;">
            <option value="">検索してください</option>
        </select>
    </div>
</div>

<!-- ▼ 名前入力 -->
<div class="row">
    <span class="label">名前入力</span>
    <input type="text" id="nameInput">
</div>

<!-- ▼ 選択後に表示される入力欄 -->
<div id="customerInputArea" class="section" style="display:none;">

    <div class="row">
        <span class="label">番号：</span>
        <input type="text" id="customerNumber" style="width:200px;">
    </div>

    <div class="row">
        <span class="label">名前：</span>
        <input type="text" id="customerName" style="width:200px;">
    </div>

    <div class="row">
        <span class="label">ふりがな：</span>
        <input type="text" id="customerKana" style="width:200px;">
    </div>

    <div class="row">
        <span class="label">中学：</span>
        <input type="text" id="customerSchool" style="width:200px;">
    </div>

    <div class="row">
        <span class="label">備考：</span>
        <input type="text" id="customerNote" style="width:300px;">
    </div>

</div>

<!-- ▼ 表示欄 -->
<div class="row">
    <span class="label">入店時間:</span>
    <span id="entryTime">--:--</span>
</div>

<div class="row">
    <span class="label">番号:</span>
    <span id="displayNumber">---</span>
</div>

<div class="row">
    <span class="label">名前:</span>
    <span id="displayName">---</span>
</div>

<div class="row">
    <span class="label">備考:</span>
    <span id="displayNote">---</span>
</div>

<!-- ▼ XLSX 読み込みライブラリ -->
<script src="xlsx.full.min.js"></script>

<script>
// ------------------------------
// Excel 読み込み用
// ------------------------------
let customerData = [];

// ------------------------------
// お客様データファイル読み込み
// ------------------------------
document.getElementById("customerFile").addEventListener("change", function (e) {
    const file = e.target.files[0];
    if (!file) return;

    const reader = new FileReader();

    reader.onload = function (event) {
        const data = new Uint8Array(event.target.result);
        const workbook = XLSX.read(data, { type: "array" });

        const sheetName = workbook.SheetNames[0];
        const sheet = workbook.Sheets[sheetName];

        customerData = XLSX.utils.sheet_to_json(sheet);

        document.getElementById("customerSearchArea").style.display = "block";

        alert("お客様データを読み込みました");
    };

    reader.readAsArrayBuffer(file);
});

// ------------------------------
// 名前検索（先頭一致）
// ------------------------------
document.getElementById("nameInput").addEventListener("input", function () {
    const keyword = this.value.trim();
    const select = document.getElementById("customerSelect");

    select.innerHTML = '<option value="">検索してください</option>';

    if (keyword === "") return;

    const results = customerData.filter(item => {
        const name = item["名前"] || "";
        const kana = item["ふりがな"] || "";
        return name.startsWith(keyword) || kana.startsWith(keyword);
    });

    results.forEach(item => {
        const option = document.createElement("option");
        option.value = item["番号"];
        option.textContent = item["名前"];
        select.appendChild(option);
    });
});

// ------------------------------
// プルダウン選択 → 入力欄へ反映
// ------------------------------
document.getElementById("customerSelect").addEventListener("change", function () {
    const number = this.value;
    if (!number) return;

    const person = customerData.find(item => item["番号"] == number);
    if (!person) return;

    document.getElementById("customerInputArea").style.display = "block";

    document.getElementById("customerNumber").value = person["番号"] || "";
    document.getElementById("customerName").value = person["名前"] || "";
    document.getElementById("customerKana").value = person["ふりがな"] || "";
    document.getElementById("customerSchool").value = person["中学"] || "";
    document.getElementById("customerNote").value = person["備考"] || "";

    document.getElementById("displayNumber").textContent = person["番号"] || "---";
    document.getElementById("displayName").textContent = person["名前"] || "---";
    document.getElementById("displayNote").textContent = person["備考"] || "---";

    const now = new Date();
    const time = now.getHours().toString().padStart(2, "0") + ":" +
                 now.getMinutes().toString().padStart(2, "0");
    document.getElementById("entryTime").textContent = time;

    alert(person["名前"] + " さんのデータを読み込みました");
});
</script>

</body>
</html>
