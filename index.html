<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026年度 成人式</title>

    <style>
        body {
            font-family: sans-serif;
            padding: 20px;
            line-height: 1.6;
            background-color: #222;   /* ダーク背景 */
            color: #f0f0f0;           /* 文字を明るく */
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
        }

        .row {
            margin-bottom: 15px;
        }

        input, select, button {
            padding: 8px;
            margin-right: 8px;
            font-size: 16px;
        }

        .label {
            font-weight: bold;
            margin-right: 10px;
        }

        .status-box {
            margin-top: 20px;
            padding: 10px;
            border: 1px solid #aaa;
        }
    </style>
</head>

<body>
<h1>2026年度 成人式</h1>

<!-- ▼ ファイル選択エリア -->
<div id="fileSelectArea" class="section" style="margin-top: 20px;">

    <div class="row">
        <span class="label">お客様データファイル：</span>
        <input type="file" id="customerFile" accept=".xlsx">
    </div>

    <div class="row" style="margin-top: 10px;">
        <span class="label">スタッフデータファイル：</span>
        <input type="file" id="staffFile" accept=".xlsx">
    </div>

</div>

<!-- ▼ お客様選択エリア（データ読み込み後に表示） -->
<div id="customerSelectArea" class="section" style="margin-top: 20px; display: none;">

    <div class="row">
        <span class="label">お客様データ：</span>

        <select id="customerSelect" style="width: 250px;">
            <option value="">選択してください</option>
        </select>
    </div>

</div>

<!-- ▼ 新規入力フォーム（普段は非表示） -->
<div id="customerInputArea" class="section" style="margin-top: 20px; display: none;">

    <div class="row">
        <span class="label">番号：</span>
        <input type="text" id="customerNumber" style="width: 200px;">
    </div>

    <div class="row">
        <span class="label">名前：</span>
        <input type="text" id="customerName" style="width: 200px;">
    </div>

    <div class="row">
        <span class="label">ふりがな：</span>
        <input type="text" id="customerKana" style="width: 200px;">
    </div>

    <div class="row">
        <span class="label">中学：</span>
        <input type="text" id="customerSchool" style="width: 200px;">
    </div>

    <div class="row">
        <span class="label">備考：</span>
        <input type="text" id="customerNote" style="width: 300px;">
    </div>

</div>
<!-- ▼ 保存ボタン（新規入力フォームの最後） -->
<button id="saveCustomer" style="margin-top: 10px;">保存</button>
</div>


<!-- ▼ 名前検索 -->
<div class="row" style="margin-top: 20px;">
    <span class="label">名前入力</span>
    <input type="text" id="nameInput">
    <button id="nameSearchBtn">検索</button>
</div>

<!-- ▼ 名前検索の候補プルダウン -->
<div id="customerSearchArea" class="section" style="margin-top: 10px; display: none;">

    <div class="row">
        <span class="label">候補：</span>
        <select id="customerSearchSelect" style="width: 250px;">
            <option value="">検索してください</option>
        </select>
    </div>

</div>


<!-- ▼ 新規追加ボタン -->
<div class="row" style="margin-top: 20px;">
    <button onclick="location.href='new_person.html'">新規成人者追加</button>
    <button onclick="location.href='new_staff.html'">新規担当者追加</button>
</div>


<!-- ▼ 番号検索 -->
<div class="row" style="margin-top: 20px;">
    <span class="label">番号入力</span>
    <input type="text" id="numberInput">
    <button id="numberSearchBtn">検索</button>
</div>
