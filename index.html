<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>成人式 総合管理画面</title>

    <style>
        body {
            font-family: sans-serif;
            background-color: #f5f5f5;
            color: #333;
            padding: 20px;
        }

        h2 {
            margin-top: 0;
            border-left: 6px solid #0078d7;
            padding-left: 10px;
        }

        .block {
            background-color: #ffffff;
            padding: 20px;
            margin-bottom: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
        }

        .sub-block {
            background-color: #fafafa;
            padding: 15px;
            margin-top: 15px;
            border-radius: 8px;
            border: 1px solid #ddd;
        }

        input, select, button {
            padding: 10px;
            margin: 8px 0;
            width: 100%;
            border-radius: 6px;
            border: 1px solid #ccc;
            font-size: 16px;
        }

        button {
            background-color: #0078d7;
            color: #fff;
            border: none;
        }

        button:hover {
            background-color: #005fa3;
        }
            /* ===== ダークモード上書き設定 ===== */

    body {
        background-color: #1a1a1a !important;
        color: #e6e6e6 !important;
    }

    .block {
        background-color: #262626 !important;
        box-shadow: 0 2px 6px rgba(0,0,0,0.6) !important;
    }

    .sub-block {
        background-color: #333333 !important;
        border: 1px solid #444444 !important;
    }

    input, select, button {
        background-color: #1f1f1f !important;
        color: #e6e6e6 !important;
        border: 1px solid #555 !important;
    }

    button {
        background-color: #4da3ff !important;
        color: #000 !important;
        font-weight: bold !important;
    }

    button:hover {
        background-color: #1e90ff !important;
    }
    </style>
</head>

<body>

    <!-- データ読み込み -->
    <div class="block">
        <h2>【データ読み込み】</h2>
        <input type="file" id="nameFile"> 名前データ（Excel）
        <input type="file" id="staffFile"> スタッフデータ（Excel）
    </div>

    <!-- 検索 -->
    <div class="block">
        <h2>【検索】</h2>

        <div class="sub-block">
            <h3>名前検索</h3>
            <input type="text" id="nameSearch" placeholder="名前を入力">
            <button>新規成人者追加</button>
            <button>新規担当者追加</button>
        </div>

        <div class="sub-block">
            <h3>番号検索</h3>
            <input type="number" id="numberSearch" placeholder="番号を入力">
        </div>
    </div>

    <!-- 個別情報 -->
    <div class="block">
        <h2>【個別情報】</h2>
        <input type="text" id="time" placeholder="入店時間">
        <input type="text" id="number" placeholder="番号">
        <input type="text" id="personName" placeholder="名前">
        <input type="text" id="memo" placeholder="備考">
    </div>

    <!-- 作業 -->
    <div class="block">
        <h2>【作業】</h2>

        <div class="sub-block">
            <h3>着付け</h3>
            <select id="kimonoMain"><option>担当者</option></select>
            <select id="kimonoSub"><option>サブ担当者</option></select>
            <label><input type="checkbox" id="kimonoFix"> お直しあり</label>
            <select id="kimonoFixStaff"><option>お直し担当者</option></select>
        </div>

        <div class="sub-block">
            <h3>メイク</h3>
            <select id="makeMain"><option>担当者</option></select>
            <select id="makeSub"><option>サブ担当者</option></select>
            <label><input type="checkbox" id="makeFix"> お直しあり</label>
            <select id="makeFixStaff"><option>お直し担当者</option></select>
        </div>

        <div class="sub-block">
            <h3>ヘアー</h3>
            <select id="hairMain"><option>担当者</option></select>
            <select id="hairSub"><option>サブ担当者</option></select>
            <label><input type="checkbox" id="hairFix"> お直しあり</label>
            <select id="hairFixStaff"><option>お直し担当者</option></select>
        </div>
    </div>

    <!-- 全体状況 -->
    <div class="block">
        <h2>【全体状況】</h2>
        <p id="kimonoStatus">着付け：0 / 0</p>
        <p id="makeStatus">メイク：0 / 0</p>
        <p id="hairStatus">ヘアー：0 / 0</p>
    </div>
   

    <!-- 👇 この下に貼る -->
    <script>
   
        // ===== データ保持用の変数 =====
        let persons = [];          // 名前データ（成人者一覧）
        let staffList = [];        // スタッフ一覧（プルダウンに使う）
        let totals = {
            kimonoTotal: 0,        // 着付けの全体人数（基本 全員）
            makeTotal: 0,          // メイク希望者人数（メイク=有）
            hairTotal: 0           // ヘアー希望者人数（ヘアー=有）
        };

        // ===== CSV を読み込むヘルパー関数 =====    

       document.getElementById("customerFile").addEventListener("change", function (e) {
    const file = e.target.files[0];
    if (!file) return;

    const reader = new FileReader();

    reader.onload = function (event) {

        // Excelデータをバイナリとして読み込む
        const data = new Uint8Array(event.target.result);

        // Excelを解析
        const workbook = XLSX.read(data, { type: "array" });

        // 最初のシートを取得
        const sheetName = workbook.SheetNames[0];
        const sheet = workbook.Sheets[sheetName];

        // シートをJSONに変換
        const json = XLSX.utils.sheet_to_json(sheet);

        persons = [];
        totals.kimonoTotal = 0;
        totals.makeTotal = 0;
        totals.hairTotal = 0;

        json.forEach(row => {
            const person = {
                number: row["番号"] || "",
                name: row["名前"] || "",
                kimono: row["着付け"] || "",
                make: row["メイク"] || "",
                hair: row["ヘアー"] || "",
                memo: row["備考"] || ""
            };

            if (!person.name && !person.number) return;

            persons.push(person);

            if (!person.kimono || person.kimono === "有") totals.kimonoTotal++;
            if (person.make === "有") totals.makeTotal++;
            if (person.hair === "有") totals.hairTotal++;
        });

        document.getElementById("kimonoStatus").textContent =
            `着付け：0 / ${totals.kimonoTotal}`;
        document.getElementById("makeStatus").textContent =
            `メイク：0 / ${totals.makeTotal}`;
        document.getElementById("hairStatus").textContent =
            `ヘアー：0 / ${totals.hairTotal}`;
    };

    reader.readAsArrayBuffer(file);
});

            // ===== 担当者が選ばれたら仕上がり人数を更新 =====

        // 担当者プルダウンのID一覧
        const workSelects = [
            "kimonoMain", "kimonoSub",
            "makeMain", "makeSub",
            "hairMain", "hairSub"
        ];

        // すべての担当者プルダウンにイベントを付ける
        workSelects.forEach(id => {
            document.getElementById(id).addEventListener("change", updateFinishCount);
        });

        function updateFinishCount() {
            // 仕上がり人数カウント用
            let kimonoDone = 0;
            let makeDone = 0;
            let hairDone = 0;

            persons.forEach(p => {
                // 着付け（基本全員対象）
                if (p.kimono === "有" || p.kimono === "" || p.kimono === undefined) {
                    // 担当者が入っていたら仕上がり扱い
                    if (p.kimonoMain || p.kimonoSub) {
                        kimonoDone++;
                    }
                }

                // メイク（希望者のみ）
                if (p.make === "有") {
                    if (p.makeMain || p.makeSub) {
                        makeDone++;
                    }
                }

                // ヘアー（希望者のみ）
                if (p.hair === "有") {
                    if (p.hairMain || p.hairSub) {
                        hairDone++;
                    }
                }
            });

            // 画面に反映
            document.getElementById("kimonoStatus").textContent =
                `着付け：${kimonoDone} / ${totals.kimonoTotal}`;

            document.getElementById("makeStatus").textContent =
                `メイク：${makeDone} / ${totals.makeTotal}`;

            document.getElementById("hairStatus").textContent =
                `ヘアー：${hairDone} / ${totals.hairTotal}`;
        }
        document.getElementById("staffFile").addEventListener("change", function (e) {
    const file = e.target.files[0];
    if (!file) return;

    const reader = new FileReader();

    reader.onload = function (event) {

        const data = new Uint8Array(event.target.result);
        const workbook = XLSX.read(data, { type: "array" });

        const sheetName = workbook.SheetNames[0];
        const sheet = workbook.Sheets[sheetName];

        const json = XLSX.utils.sheet_to_json(sheet);

        staffList = json.map(row => row["名前"] || row["氏名"] || row[Object.keys(row)[0]]);

        const selects = [
            "kimonoMain", "kimonoSub", "kimonoFixStaff",
            "makeMain", "makeSub", "makeFixStaff",
            "hairMain", "hairSub", "hairFixStaff"
        ].map(id => document.getElementById(id));

        selects.forEach(sel => {
            sel.innerHTML = "";
            const emptyOpt = document.createElement("option");
            emptyOpt.value = "";
            emptyOpt.textContent = "選択してください";
            sel.appendChild(emptyOpt);

            staffList.forEach(name => {
                const opt = document.createElement("option");
                opt.value = name;
                opt.textContent = name;
                sel.appendChild(opt);
            });
        });
    };

    reader.readAsArrayBuffer(file);
});
        // ===== 担当者選択時に該当者へ保存 =====
        function bindPersonToWork(person) {
            // 着付け
            person.kimonoMain = document.getElementById("kimonoMain").value;
            person.kimonoSub  = document.getElementById("kimonoSub").value;

            // メイク
            person.makeMain = document.getElementById("makeMain").value;
            person.makeSub  = document.getElementById("makeSub").value;

            // ヘアー
            person.hairMain = document.getElementById("hairMain").value;
            person.hairSub  = document.getElementById("hairSub").value;

            updateFinishCount();
        }

        // 番号検索や名前検索で人が決まったら呼ぶ
        function updateWorkBlocks(person) {
            // 既存の処理（ブロックの薄さ変更）
            const makeBlock = document.querySelectorAll(".sub-block")[1];
            makeBlock.style.opacity = (person.make === "有") ? 1 : 0.3;

            const hairBlock = document.querySelectorAll(".sub-block")[2];
            hairBlock.style.opacity = (person.hair === "有") ? 1 : 0.3;

            // 担当者プルダウンの選択状態を反映
            document.getElementById("kimonoMain").value = person.kimonoMain || "";
            document.getElementById("kimonoSub").value  = person.kimonoSub  || "";

            document.getElementById("makeMain").value = person.makeMain || "";
            document.getElementById("makeSub").value  = person.makeSub  || "";

            document.getElementById("hairMain").value = person.hairMain || "";
            document.getElementById("hairSub").value  = person.hairSub  || "";

            // 担当者変更時に person に保存
            workSelects.forEach(id => {
                document.getElementById(id).onchange = () => bindPersonToWork(person);
            });
        } 
    </script>           
</body>
</html>
